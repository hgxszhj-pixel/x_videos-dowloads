[package]
name = "x-video-downloader"
version = "0.1.0"
edition = "2021"
authors = ["X Video Downloader Team"]
description = "A high-performance video downloader for x.com (Twitter) videos"
license = "MIT"

[dependencies]
# 异步运行时
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "rt", "sync", "net"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "native-tls", "blocking", "gzip", "brotli", "http2"], default-features = false }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日志系统
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], default-features = false }

# 异步 trait
async-trait = "0.1"

# URL 处理
url = "2.5"

# CLI 参数解析
clap = { version = "4.4", features = ["derive"] }

# 正则表达式
regex = "1.10"

# Python 解释器查找
which = "6"

# 日期时间
chrono = { version = "0.4", features = ["serde", "clock", "std"], default-features = false }

# 异步流处理
futures = "0.3"

# 字节处理
bytes = "1.5"

# 临时文件管理
tempfile = "3.10"

# LRU 缓存
lru = "0.10"

# 单例模式
once_cell = "1.19"

# 文件路径处理
directories = "5.0"

# 配置文件
toml = "0.8"

# 随机数生成
rand = "0.8"

# 文件对话框
rfd = "0.15"

# 图片处理
image = "0.25"

# 协作文能
tokio-tungstenite = "0.21"
futures-util = "0.3"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# HMAC 认证
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# 本地 IP
local-ip-address = "0.6"

# shell 命令参数转义
shell-words = "1.0"

# X-Bogus 签名
md5 = "0.7"
rc4 = "0.1"

# SM3 国密哈希
sm3 = "0.5"

# STUN (NAT穿透) - 0.17.x required for RUSTSEC-2025-0009
stun = "0.17"
dirs = "6.0.0"

# Dioxus GUI (迁移自 Slint)
dioxus = { version = "0.7.9", features = ["desktop", "web"] }
dioxus-stores = { version = "0.7.9", default-features = false }

# 文件监控 (配置热重载)
notify = "6"

# HLS/m3u8 解析
m3u8 = "0.1"
aes = "0.8"
cbc = "0.2"
generic-array = "0.14"
typenum = "1.17"

# Chromium cookie 解密 (PBKDF2-HMAC-SHA1(password, saltysalt, 1003, 16) → AES-128-CBC)
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha1 = "0.10"

# 浏览器自动化(CDP)—— 用于 TulingPython 解析器拦截 m3u8，替换原 Python patchright 子进程。
# 个人自用：source-available 协议（禁商用），详见 https://github.com/MageGojo/drission-rs/LICENSE
# crates.io 落后到 0.3.2，必须用 git tag 锁定 v0.5.0。
drission = { git = "https://github.com/MageGojo/drission-rs", tag = "v0.5.0", default-features = false, features = ["cdp"] }

[dev-dependencies]
tempfile = "3.10"
bumpalo = "3.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "x-video-downloader"
path = "src/main.rs"

[[bench]]
name = "hls_concurrency"
harness = false

[[bench]]
name = "hls_parse"
harness = false
